<svg width="92" height="32" viewBox="0 0 92 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gaps on Triangle where Circle passes OVER -->
    <mask id="m1-tri-mask">
      <rect width="92" height="32" fill="white" />
      <circle cx="46" cy="16" r="11" stroke="black" stroke-width="5" fill="none" />
      <!-- Restore bottom crossing so triangle is over at bottom -->
      <path d="M 28 24 L 37 27" stroke="white" stroke-width="6" stroke-linecap="round" />
    </mask>
  </defs>
  <g stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Brace { (Azul Escuro) -->
    <path d="M 9 5 C 5 5 5 11 5 13 C 5 15 2 16 1 16 C 2 16 5 17 5 19 C 5 21 5 27 9 27" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" fill="none" />

    <!-- Triangle: Amarelo -->
    <polygon points="24,5 35,27 13,27" fill="none" stroke="#fbbf24" mask="url(#m1-tri-mask)" />
    <!-- Circle: Vermelho (Arco 100% Suave e Sem Recorte) -->
    <circle cx="46" cy="16" r="11" fill="none" stroke="#ef4444" />
    <!-- Square: Branco -->
    <rect x="57" y="5" width="22" height="22" rx="3" fill="none" stroke="#ffffff" />

    <!-- Right Brace } (Azul Escuro) -->
    <path d="M 83 5 C 87 5 87 11 87 13 C 87 15 90 16 91 16 C 90 16 87 17 87 19 C 87 21 87 27 83 27" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" fill="none" />
  </g>
</svg>