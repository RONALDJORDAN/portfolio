<svg width="72" height="32" viewBox="0 0 72 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gaps on Triangle where Circle passes OVER -->
    <mask id="m1-tri-mask">
      <rect width="72" height="32" fill="white" />
      <circle cx="36" cy="16" r="11" stroke="black" stroke-width="5" fill="none" />
      <!-- Restore bottom crossing so triangle is over at bottom -->
      <path d="M 18 24 L 27 27" stroke="white" stroke-width="6" stroke-linecap="round" />
    </mask>
    <!-- Gaps on Circle where Square passes OVER -->
    <mask id="m1-circ-mask">
      <rect width="72" height="32" fill="white" />
      <!-- Square top side passes OVER Circle -->
      <path d="M 45 5 L 53 5" stroke="black" stroke-width="5" stroke-linecap="round" />
      <path d="M 47 3 L 47 13" stroke="black" stroke-width="5" stroke-linecap="round" />
    </mask>
  </defs>
  <g stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Triangle -->
    <polygon points="14,5 25,27 3,27" fill="none" mask="url(#m1-tri-mask)" />
    <!-- Circle -->
    <circle cx="36" cy="16" r="11" fill="none" mask="url(#m1-circ-mask)" />
    <!-- Square -->
    <rect x="47" y="5" width="22" height="22" rx="3" fill="none" />
  </g>
</svg>