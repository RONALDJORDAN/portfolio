<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Mask for Square: Triangle passes OVER Square at top and bottom-left/right -->
    <mask id="m2-sq-mask">
      <rect width="48" height="48" fill="white" />
      <path d="M 12 11 L 18 11" stroke="black" stroke-width="5" stroke-linecap="round" />
      <path d="M 30 11 L 36 11" stroke="black" stroke-width="5" stroke-linecap="round" />
      <path d="M 11 32 L 11 37" stroke="black" stroke-width="5" stroke-linecap="round" />
      <path d="M 37 32 L 37 37" stroke="black" stroke-width="5" stroke-linecap="round" />
    </mask>
    <!-- Mask for Triangle: Circle passes OVER Triangle -->
    <mask id="m2-tri-mask">
      <rect width="48" height="48" fill="white" />
      <path d="M 14 20 L 20 14" stroke="black" stroke-width="5" stroke-linecap="round" />
      <path d="M 34 20 L 28 14" stroke="black" stroke-width="5" stroke-linecap="round" />
    </mask>
    <!-- Mask for Circle: Square passes OVER Circle -->
    <mask id="m2-circ-mask">
      <rect width="48" height="48" fill="white" />
      <path d="M 20 8 L 28 8" stroke="black" stroke-width="5" stroke-linecap="round" />
      <path d="M 20 40 L 28 40" stroke="black" stroke-width="5" stroke-linecap="round" />
    </mask>
  </defs>
  <g stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 1. Square -->
    <rect x="11" y="11" width="26" height="26" rx="3" fill="none" mask="url(#m2-sq-mask)" />
    <!-- 2. Triangle -->
    <polygon points="24,3 43,39 5,39" fill="none" mask="url(#m2-tri-mask)" />
    <!-- 3. Circle -->
    <circle cx="24" cy="24" r="16" fill="none" mask="url(#m2-circ-mask)" />
  </g>
</svg>